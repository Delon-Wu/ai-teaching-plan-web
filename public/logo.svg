<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 64" fill="none">
  <defs>
    <linearGradient id="logo-teal" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#3FA89A"/>
    </linearGradient>
  </defs>
  <!-- Book pages forming an abstract K (课) character -->
  <g transform="translate(8, 8)">
    <!-- Left page -->
    <rect x="2" y="4" width="14" height="36" rx="2" fill="url(#logo-teal)" opacity="0.95"/>
    <!-- Right page (lifted) -->
    <rect x="18" y="0" width="14" height="36" rx="2" fill="url(#logo-teal)" opacity="0.75"/>
    <!-- Accent line (copper) -->
    <rect x="4" y="10" width="10" height="2.5" rx="1" fill="#C17A52" opacity="0.8"/>
    <rect x="4" y="20" width="10" height="2.5" rx="1" fill="#C17A52" opacity="0.5"/>
    <rect x="20" y="14" width="10" height="2.5" rx="1" fill="#C17A52" opacity="0.6"/>
    <rect x="20" y="24" width="6" height="2.5" rx="1" fill="#C17A52" opacity="0.4"/>
    <!-- Spark from pages -->
    <circle cx="34" cy="4" r="2" fill="#C17A52" opacity="0.9"/>
    <circle cx="36" cy="-2" r="1.2" fill="#C17A52" opacity="0.5"/>
  </g>
  <!-- Chinese text -->
  <text x="54" y="38" font-family="'Noto Serif SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="22" font-weight="700" fill="#0D7377" letter-spacing="2">课研智造</text>
  <!-- Tagline -->
  <text x="54" y="55" font-family="'Noto Sans SC','PingFang SC','Microsoft YaHei',sans-serif" font-size="10" fill="#8A857C" letter-spacing="4">教研有方 创造有序</text>
</svg>
