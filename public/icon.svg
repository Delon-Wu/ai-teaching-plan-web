<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0D7377"/>
      <stop offset="100%" stop-color="#084547"/>
    </linearGradient>
  </defs>
  <!-- App icon background -->
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Left book page -->
  <rect x="104" y="120" width="128" height="260" rx="20" fill="white" opacity="0.95"/>
  <!-- Right book page (lifted, tilted slightly) -->
  <g transform="rotate(-4, 272, 248)">
    <rect x="240" y="100" width="128" height="260" rx="20" fill="white" opacity="0.78"/>
    <rect x="252" y="140" width="100" height="28" rx="12" fill="#C17A52" opacity="0.7"/>
    <rect x="252" y="190" width="80" height="28" rx="12" fill="#C17A52" opacity="0.5"/>
    <rect x="252" y="240" width="100" height="28" rx="12" fill="#C17A52" opacity="0.35"/>
    <rect x="252" y="290" width="60" height="28" rx="12" fill="#C17A52" opacity="0.25"/>
  </g>
  <!-- Left page accent lines -->
  <rect x="124" y="160" width="88" height="24" rx="10" fill="#C17A52" opacity="0.8"/>
  <rect x="124" y="210" width="88" height="24" rx="10" fill="#C17A52" opacity="0.55"/>
  <rect x="124" y="260" width="72" height="24" rx="10" fill="#C17A52" opacity="0.35"/>
  <!-- Copper spark dot -->
  <circle cx="396" cy="108" r="18" fill="#C17A52" opacity="0.8"/>
</svg>
