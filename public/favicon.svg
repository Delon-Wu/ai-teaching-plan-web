  <rect x="7.5" y="14" width="5" height="2" rx="0.8" fill="#C17A52" opacity="0.6"/>
  <rect x="16.5" y="11" width="5" height="2" rx="0.8" fill="#C17A52" opacity="0.7"/>
  <rect x="16.5" y="16" width="3" height="2" rx="0.8" fill="#C17A52" opacity="0.5"/>
</svg>
